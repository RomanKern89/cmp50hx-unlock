[package]
name = "search-svc"
version = "1.0.0"
edition = "2021"
description = "Safe web search & fetch service for local LLMs (Rust port)"
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["gzip", "brotli", "stream", "json", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = "0.29"
ego-tree = "0.11"
url = "2"
roxmltree = "0.21"
encoding_rs = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
