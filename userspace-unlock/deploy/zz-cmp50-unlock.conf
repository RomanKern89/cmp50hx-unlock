# Keep the NVIDIA driver from binding the CMP 50HX before the userspace unlock
# has run. An explicit "modprobe nvidia" still works, which is what
# cmp50-unlock.service does once the cards are unlocked.
blacklist nvidia
blacklist nvidia_drm
blacklist nvidia_modeset
blacklist nvidia_uvm

# vfio is the userspace MMIO transport. No-IOMMU mode is required on hosts
# without an IOMMU, and it also means the addresses the firmware reads are
# plain physical addresses.
options vfio enable_unsafe_noiommu_mode=1
